<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>API PAIS CLIMA RECETA </title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <h1>Consulta de País, Clima y Receta</h1>

    <div class="search-container">
      <label for="paisInput" class="visually-hidden">Nombre del país en Inglés:</label>
      <input type="text" id="paisInput" placeholder="Ej: France">
      <button id="buscarBtn">Consultar</button>
    </div>

    <section id="resultados">
      <div class="card" id="infoPais">
        <h2>Información del País</h2>
        <p>Aquí aparecerán los datos del país...</p>
      </div>
      
      <div class="card" id="infoClima">
        <h2>Clima Actual</h2>
        <p>Aquí aparecerá el clima...</p>
      </div>

      <div class="card" id="infoReceta">
        <h2>Receta Típica</h2>
        <p>Aquí aparecerá la receta...</p>
      </div>
    </section>
    <pre id="debugOutput"></pre>
  </div>

  <script type="module" src="js/api.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
