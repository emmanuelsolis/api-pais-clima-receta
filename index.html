<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Mi App de APIs</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="styles.css" />
  
 
</head>
<body>
  <h1>Consulta de País, Clima y Receta</h1>

  <label for="paisInput">Nombre del país en Inglés:</label>
  <input type="text" id="paisInput" placeholder="Ej: Francia">
  <button id="buscarBtn">Consultar</button>

  <section id="resultados">
    <div class="card" id="infoPais">
      <h2>Información del País</h2>
      <p>Aquí aparecerán los datos del país...</p>
    </div>
    
    <div class="card" id="infoClima">
      <h2>Clima Actual</h2>
      <p>Aquí aparecerá el clima...</p>
    </div>

    <div class="card" id="infoReceta">
      <h2>Receta Típica</h2>
      <p>Aquí aparecerá la receta...</p>
    </div>
  </section>

  <h3>Datos JSON sin procesar:</h3>
  <pre id="debugOutput">—</pre>

  <script type="module" src="js/api.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
